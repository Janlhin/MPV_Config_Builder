<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文档 · MPV Config Builder</title>
<link rel="stylesheet" href="style.css">
<style>
  .doc { max-width: 900px; margin: 0 auto; }
  .doc h1 { font-size: 24px; margin: 6px 0 14px; }
  .doc h2 { font-size: 19px; margin: 28px 0 10px; padding-top: 6px; border-top: 1px solid var(--border); }
  .doc h3 { font-size: 16px; margin: 20px 0 8px; }
  .doc h4 { font-size: 14px; margin: 16px 0 6px; color: var(--muted); }
  .doc p, .doc li { line-height: 1.75; }
  .doc code {
    background: var(--panel-2); border-radius: 5px; padding: 1px 5px;
    font: 12.5px Consolas, monospace; color: var(--accent);
  }
  .doc pre {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; overflow: auto;
  }
  .doc pre code { background: none; padding: 0; color: var(--text); font-size: 12.5px; line-height: 1.7; }
  .doc table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13px; }
  .doc th, .doc td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .doc th { background: var(--panel-2); }
  .doc blockquote {
    margin: 12px 0; padding: 10px 14px; border-left: 3px solid var(--accent);
    background: var(--panel-2); border-radius: 0 10px 10px 0; color: var(--muted);
  }
  .doc hr { border: 0; border-top: 1px solid var(--border); margin: 22px 0; }
  .doc ul, .doc ol { padding-left: 22px; }
  .doc a { color: var(--accent); }
  .toc { display: flex; gap: 8px; flex-wrap: wrap; }
</style>
</head>
<body data-page="guide">

<div class="topbar">
  <div class="brand">📖 <span data-i18n="guide.brand">文档</span> <small id="docTitle" data-no-i18n></small></div>
  <div class="spacer"></div>
  <a class="btn small" href="index.html">🔀 <span data-i18n="guide.switchMode">切换模式</span></a>
  <button class="btn small" data-theme-toggle>🌓</button>
</div>

<div class="content">
  <div class="card" id="docLangNote" hidden style="max-width:900px;margin:0 auto 12px;padding:10px 14px"></div>
  <div class="toc" id="toc" style="max-width:900px;margin:0 auto 12px"></div>
  <div class="card doc" id="doc">（正在读取…）</div>
</div>

<script src="i18n.js"></script>
<script src="i18n-zh2en.js"></script>
<script src="api.js"></script>
<script>
const DOC_ICONS = { guide: '🧭', shaders: '✨', thanks: '🙏', roadmap: '🗺️' };
const DOC_LABEL_KEYS = { guide: 'doc.guide', shaders: 'doc.shaders', thanks: 'doc.thanks', roadmap: 'doc.roadmap' };

function docLabel(doc) {
  return I18N.t(DOC_LABEL_KEYS[doc] || 'doc.guide');
}

function currentDoc() {
  const q = new URLSearchParams(location.search).get('doc');
  return q || 'guide';
}

const DOC_FILES = { guide: '入门指南.md', shaders: 'MPV_Shader搭配说明书.md',
  thanks: '致谢与许可.md', roadmap: '产品规划与路线图.md' };
const DOC_FILES_EN = { guide: '入门指南.en.md', shaders: 'MPV_Shader搭配说明书.en.md',
  thanks: '致谢与许可.en.md', roadmap: '产品规划与路线图.en.md' };

function docFile(id) {
  const en = window.I18N && I18N.lang() === 'en';
  return (en ? DOC_FILES_EN : DOC_FILES)[id] || (en ? DOC_FILES_EN : DOC_FILES).guide;
}

async function load(doc) {
  const box = document.getElementById('doc');
  box.innerHTML = '<p class="note">' + I18N.t('guide.loading') + '</p>';
  // 静态模式（Q-006 A）：没有后端渲染 md，退回取仓库里的原文纯文本展示。
  if (MPVCB.STATIC) {
    const text = await API.staticText('docs/' + docFile(doc));
    document.getElementById('docTitle').textContent = docLabel(doc);
    box.innerHTML = text
      ? '<p class="note">' + I18N.t('static.docNote') + '</p><pre class="doc">'
        + esc(text) + '</pre>'
      : '<p class="note danger">❌ ' + I18N.t('static.docMissing') + '</p>';
    return;
  }
  // ⚠ 走 API.guide，不要直接 fetch —— 直连在外壳的 stdio 通道下不通
  const r = await API.guide(doc)
    .catch(() => ({ ok: false, detail: I18N.t('guide.readFailed') }));
  const toc = document.getElementById('toc');
  if (r.docs && toc) {
    toc.innerHTML = r.docs.map(d =>
      `<a class="btn small${d.id === doc ? ' primary' : ''}" href="?doc=${d.id}">
        ${DOC_ICONS[d.id] || '📄'} ${esc(docLabel(d.id))}</a>`).join('');
  }
  if (!r.ok) { box.innerHTML = `<p class="note danger">❌ ${esc(r.detail)}</p>`; return; }
  document.getElementById('docTitle').textContent = docLabel(doc);
  box.innerHTML = r.html;
  box.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; });
}

function updateLangNote() {
  const el = document.getElementById('docLangNote');
  if (el) el.hidden = true;   // 4 份文档已有英文版，不再提示「仅中文」
}

document.addEventListener('i18n:change', () => { updateLangNote(); load(currentDoc()); });
updateLangNote();
load(currentDoc());
</script>
</body>
</html>
