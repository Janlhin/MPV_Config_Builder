<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>完全体 · MPV Config Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="expert">

<div class="topbar">
  <div class="brand">🧪 完全体 <small id="ver"></small></div>
  <div class="target"><span data-i18n="topbar.target">目标：</span><code id="targetLabel">未设置</code>
    <button class="btn small ghost" id="pickDir">更改</button></div>
  <div class="spacer"></div>
  <a class="btn small" href="index.html">🔀 切换模式</a>
  <button class="btn small" id="loadTop">📂 读取现有配置</button>
  <button class="btn small primary" id="applyTop" data-primary data-primary-icon="✅">✅ 生成配置</button>
  <button class="btn small" data-theme-toggle>🌓</button>
</div>

<div class="shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="card tight" style="margin-bottom:12px">
      <div class="seg" id="modeSeg" style="display:inline-flex">
        <button data-mode="create">🆕 从零创建</button>
        <button data-mode="edit">✏️ 改现有配置</button>
      </div>
      <p class="note" id="modeHint" style="margin-top:8px"></p>
    </div>
    <div class="cols">
      <div>
        <h1 id="secTitle">📚 全部选项</h1>
        <p class="sub" id="secSub"></p>
        <div id="panes"></div>
      </div>

      <div>
        <div class="card" id="previewCard">
          <h2>📋 <span id="previewTitle">实时生成的 mpv.conf</span></h2>
          <div class="dirbar" id="profileBar" style="display:none">
            <span class="note" id="profileBarText"></span>
            <select id="profileSel" style="flex:1"></select>
            <button class="btn small" id="profileLoad" data-i18n="profile.load">载入它的选项</button>
          </div>
          <pre class="conf" id="preview">（正在加载…）</pre>
          <div id="diffBox" style="display:none"></div>
          <div class="actions">
            <button class="btn primary" onclick="applyConfig(this)" data-primary data-primary-icon="✅">✅ 生成配置</button>
            <button class="btn" onclick="copyConf()">📋 复制</button>
            <button class="btn" onclick="saveAs()">💾 另存为</button>
            <button class="btn" id="diffToggle" style="display:none">🔀 逐行对比</button>
          </div>
          <p class="note" style="margin-top:10px">
            写入 <code id="previewFile">—</code> · 改动 <b id="changeCount">0</b> 处<br>
            <span id="previewMode">独立 include 文件</span>
            <span id="encodingHint" class="muted"></span></p>
          <p class="note" style="margin-top:4px" id="pendingHint"></p>
          <p class="note" style="margin-top:4px" id="chainHint"></p>
        </div>

        <div class="card tight">
          <h2>📊 评估与体检</h2>
          <div id="scoreBox" class="muted">（等配置出来再算）</div>
          <div id="issueBox" style="margin-top:8px"><p class="note">—</p></div>
        </div>

        <div class="card tight">
          <h2>📤 写入方式</h2>
          <div class="seg" id="writeSeg">
            <button data-v="include" class="on">🧩 独立文件</button>
            <button data-v="merge">📄 合并进 mpv.conf</button>
          </div>
          <div class="dirbar" style="margin-top:10px">
            <select id="srcSelect" style="flex:1"></select>
            <button class="btn small" id="srcLoad">📂 读取</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<aside class="drawer" id="drawer">
  <h3><span data-i18n="drawer.explain">说明</span> <span class="key"></span></h3>
  <div class="sig"></div>
  <div class="body"></div>
  <div class="drawer-foot">
    <p class="note" data-i18n="drawer.closeHint">点别处 / 再点一次 i / Esc / 右键 都能关</p>
    <div class="actions">
      <button class="btn primary small" data-role="fill" data-i18n="drawer.fill">填入建议值</button>
      <button class="btn small ghost" onclick="closeDrawer()" data-i18n="drawer.close">关闭</button>
    </div>
  </div>
</aside>

<script src="i18n.js"></script>
<script src="i18n-zh2en.js"></script>
<script src="api.js"></script>
<script src="state.js"></script>
<script>
/* ============================================================
   完全体：核心参数 + 全部原生选项 + 自定义层 + 版本回滚
   选项来自 /api/options（核心 28 + 原生 89），自定义层随便写
   ============================================================ */

const GROUP_ICONS = {
  '视频输出': '🖥️', '缩放': '🎨', '补帧': '⏱️', '字幕': '💬', '音频': '🔊',
  '窗口': '🪟', '性能 / 缓存': '⚡',
  '画质细节': '🔬', '色彩 / HDR': '🌈', '字幕明细': '💬', '音频明细': '🎧',
  '行为 / 界面': '🪟', '截图 / 其它': '📸'
};

let SECTIONS = [];
let cur = 'all';
let filter = '';

function buildSections() {
  const coreGroups = [...new Set((APP.options.core || []).map(x => x.group))];
  const nativeGroups = (APP.options.groups && APP.options.groups.length)
    ? APP.options.groups : [...new Set((APP.options.native || []).map(x => x.group))];
  SECTIONS = [
    { id: 'all', icon: '📚', name: I18N.t('section.all'), sub: '' },
    { id: 'custom', icon: '🧩', name: I18N.t('section.custom'), sub: I18N.t('section.customSub') },
    { id: 'backup', icon: '🕘', name: I18N.t('section.backup'), sub: I18N.t('section.backupSub') },
    ...coreGroups.map(g => ({ id: 'g:' + g, icon: GROUP_ICONS[g] || '⚙️', name: groupLabel(g), items: byGroup(g, 'core') })),
    ...nativeGroups.map(g => ({ id: 'g:' + g, icon: GROUP_ICONS[g] || '⚙️', name: groupLabel(g), items: byGroup(g, 'native') })),
    { id: 'shader', icon: '✨', name: I18N.t('section.shader'), sub: I18N.t('section.shaderSub') },
    { id: 'uosc', icon: '🎛️', name: I18N.t('section.uosc'), sub: I18N.t('section.uoscSub') },
    { id: 'tools', icon: '📦', name: I18N.t('section.tools'), sub: I18N.t('section.toolsSub') },
    { id: 'about', icon: 'ℹ️', name: I18N.t('section.about'), sub: I18N.t('section.aboutSub') }
  ];
}

function byGroup(group, kind) {
  return (APP.options[kind] || []).filter(x => x.group === group);
}

function renderSidebar() {
  document.getElementById('sidebar').innerHTML = SECTIONS.map(s => {
    let n = '';
    if (s.id === 'all') n = APP.dbCount || '';
    else if (s.id === 'custom') n = APP.custom.trim() ? I18N.t('section.has') : '';
    else if (s.id === 'shader') n = APP.shaders.length || '';
    else if (s.items) n = s.items.filter(x => isOn(x.key)).length || '';
    return `<div class="side-item${s.id === cur ? ' active' : ''}" data-sec="${esc(s.id)}">
      <span class="ico">${s.icon}</span>${esc(s.name)}
      ${n ? `<span class="count">${n}</span>` : ''}</div>`;
  }).join('');
  document.getElementById('sidebar').onclick = e => {
    const el = e.target.closest('.side-item');
    if (!el) return;
    cur = el.dataset.sec;
    render();
    flashPanes();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
}

function render() {
  if (!SECTIONS.length) return;
  const sec = SECTIONS.find(s => s.id === cur) || SECTIONS[0];
  document.getElementById('secTitle').textContent = sec.icon + ' ' + sec.name;
  document.getElementById('secSub').textContent = sec.sub || '';
  const host = document.getElementById('panes');
  if (sec.items) {
    host.innerHTML = `<div class="card"><h2>${sec.icon} ${esc(sec.name)}
      <span class="muted" style="font-weight:400;font-size:12px"> · ${I18N.t('section.itemCount', { n: sec.items.length })}</span></h2>
      <div id="optbox"></div></div>`;
    mountOptions(document.getElementById('optbox'), sec.items);
  } else {
    host.innerHTML = PANES[sec.id] ? PANES[sec.id]() : '';
    if (window.I18N) I18N.apply(host, true);
    if (WIRE[sec.id]) WIRE[sec.id]();
  }
  const sel = document.getElementById('srcSelect');
  if (sel) sel.innerHTML = configOptions();
  renderSidebar();
}

/* ---------------- 各页面 ---------------- */

const PANES = {
  all: () => `
    <div class="searchbar">

      <textarea class="raw" id="customBox" spellcheck="false"
        placeholder="profile-cond=not playlist&#10;[my-profile]&#10;scale=spline36">${esc(APP.custom)}</textarea>
      <div class="actions">

    </div>
    <div class="card">
      <h2 data-i18n="ex.singleTitle">✍️ 单条写入</h2>
      <div class="row">
        <input type="text" id="ck" data-i18n-ph="ex.keyPh" placeholder="键，如 glsl-shader-reload" style="flex:1">
        <input type="text" id="cv" data-i18n-ph="ex.valPh" placeholder="值" style="flex:1">
        <button class="btn" id="cadd" data-i18n="ex.addParam">写入参数区</button>
      </div>

    </div>`,

  backup: () => `
    <div class="card">
      <h2 data-i18n="ex.backupTitle">🕘 自动备份</h2>
      <p class="note" data-i18n-html="ex.backupNote">每次写入前都会生成 <code>文件名.bak-时间戳</code>。点「回滚」会用备份覆盖当前文件，
        覆盖前还会把当前版本再备份一次。</p>
      <div class="actions"><button class="btn primary" id="bkLoad" data-i18n="ex.refresh">🔄 刷新列表</button>
        <span class="note"><span data-i18n="ex.dir">目录：</span><code>${esc(APP.target || I18N.t('ex.notSet'))}</code></span></div>
      <div id="bkList" style="margin-top:12px"><p class="note" data-i18n="ex.clickRefresh">（点刷新读一次）</p></div>
    </div>`,

  shader: () => `
    <div class="card">
      <h2><span data-i18n="ex.shaderTitle">✨ glsl-shaders</span>（${APP.shaders.length}）</h2>
      <div class="chain">${APP.shaders.map((p, i) => `<div class="chain-item">
        <span class="idx">${i + 1}</span>
        <div style="min-width:0"><div>${esc(baseName(p))}</div><code>${esc(p)}</code></div>
        <div class="right">
          <button class="btn small ghost" onclick="moveShader(${i},-1)">↑</button>
          <button class="btn small ghost" onclick="moveShader(${i},1)">↓</button>
          <button class="btn small danger" onclick="delShader(${i})">✕</button>
        </div></div>`).join('') || `<div class="chain-empty">${I18N.t('ex.empty')}</div>`}</div>
      <div class="picker">
        <select id="shaderPick">${(APP.catalog.shaders || []).map(x =>
          `<option value="${esc(x.path)}">${esc(x.name)} · ${esc(x.path)}</option>`).join('')
          || `<option value="">${I18N.t('ex.noGlsl')}</option>`}</select>
        <button class="btn primary" id="shaderAdd" data-i18n="ex.addTail">➕ 加到链尾</button>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="ex.memcTitle">🎞️ vf=vapoursynth（补帧 / 超分脚本）</h2>
      <div class="radio-list" id="memcList">${(APP.catalog.memc || []).map((x, i) =>
        `<div class="radio-item${APP.memc === x.path ? ' on' : ''}" data-memc="${i}">
          <input type="radio" ${APP.memc === x.path ? 'checked' : ''}>
          <div style="min-width:0"><div>${esc(x.name)}</div><small>${esc(x.path)}</small></div>
        </div>`).join('') || `<div class="chain-empty">${I18N.t('ex.noVpy')}</div>`}</div>
      <div class="actions"><button class="btn" onclick="setMemc('')" data-i18n="ex.noMemc">🚫 不挂</button>
        <span class="note"><span data-i18n="ex.current">当前：</span><code>${esc(APP.memc || I18N.t('ex.none'))}</code></span></div>
    </div>
    ${fusionPanelHtml()}`,

  uosc: () => `<div id="uoscHost"><p class="note">读取中…</p></div>`,

  tools: () => `
    <div class="card">
      <h2 data-i18n="ex.dlTitle">📦 下载</h2>
      <p class="note" data-i18n="ex.dlNote">本软件不打包任何第三方二进制，全部指向官方发布页。</p>
      <div class="quick" style="margin-top:10px">
        <a class="btn" target="_blank" href="https://github.com/hooke007/mpv_PlayKit/releases">📥 mpv-lazy</a>
        <a class="btn" target="_blank" href="https://github.com/stax76/mpv.net/releases">📥 mpv.net</a>
        <a class="btn" target="_blank" href="https://github.com/mpv-player/mpv/releases">📥 <span data-i18n="ex.mpvOfficial">mpv 官方</span></a>
        <a class="btn" target="_blank" href="https://hooke007.github.io/unofficial/mpv_shaders.html">📖 <span data-i18n="ex.shaderGuide">shader 说明书</span></a>
        <a class="btn" target="_blank" href="https://mpv.io/manual/master/">📚 <span data-i18n="ex.manual">mpv 手册</span></a>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="ex.scanTitle">🔍 扫描本机文件</h2>
      <div class="actions"><button class="btn primary" id="scanBtn" data-i18n="ex.scanBtn">扫描 shaders / vs</button></div>
      <pre class="conf" id="scanOut" style="margin-top:12px;max-height:32vh" data-i18n="ex.notScanned">（还没扫描）</pre>
    </div>`,

  about: () => `
    <div class="card">
      <h2 data-i18n="ex.sourceTitle">ℹ️ 数据来源</h2>
      <p class="note" data-i18n-html="ex.sourceNote">
        <b>选项清单 / 默认值</b>：mpv 自带的 <code>--list-options</code>（本机 829 项）<br>
        <b>中文说明</b>：mpv_doc-CN（社区翻译，GPL-3.0，已收录 726 条）<br>
        <b>shader / vpy 列表</b>：从你自己的便携版目录实际扫描，不是固定清单<br>
        <b>搭配建议</b>：hooke007 的《mpv shader 搭配说明书》</p>
      <div class="quick" style="margin-top:10px">
        <a class="btn" href="guide.html?doc=guide" data-i18n="ex.openGuide">📖 入门指南</a>
        <a class="btn" href="guide.html?doc=shaders" data-i18n="ex.openShaderGuide">✨ Shader 说明书</a>
      </div>
    </div>
    <div class="card">
      <h2 data-i18n="ex.creditsTitle">🙏 致谢</h2>
      <p class="note" data-i18n="ex.creditsNote">mpv 及其贡献者 · hooke007（mpv-lazy / mpv_PlayKit / shader 说明书）·
        Anime4K / FSRCNNX / RAVU / RIFE / MVTools / SVP 等算法作者 · mpv_doc-CN 翻译组 ·
        以及所有在论坛和 issue 里踩过坑的人。</p>
      <div class="quick" style="margin-top:10px">
        <a class="btn" href="guide.html?doc=thanks" data-i18n="ex.fullCredits">🙏 完整致谢与许可</a>
        <a class="btn" href="guide.html?doc=roadmap" data-i18n="ex.roadmap">🗺️ 产品说明（定位 / 四档模式 / 安全底线）</a>
      </div>
    </div>`
};

const WIRE = {
  all: () => {
    renderChips();
    const inp = document.getElementById('q');
    inp.value = DB.q;
    let timer = null;
    inp.oninput = () => {
      clearTimeout(timer);
      timer = setTimeout(() => { DB.q = inp.value.trim(); loadDb(true); }, 220);
    };
    document.getElementById('qclear').onclick = () => {
      inp.value = ''; DB.q = ''; loadDb(true);
    };
    document.getElementById('moreBtn').onclick = () => loadDb(false);
    renderTagBar();
    loadDb(true);
  },
  custom: () => {
    const box = document.getElementById('customBox');
    document.getElementById('customSave').onclick = () => {
      APP.custom = box.value; changed();
      toast('已存进配置预览', 'ok');
    };
    document.getElementById('customClear').onclick = () => {
      APP.custom = ''; box.value = ''; changed(); toast('已清空自定义层', 'ok');
    };
    document.getElementById('cadd').onclick = () => {
      const k = document.getElementById('ck').value.trim();
      const v = document.getElementById('cv').value.trim();
      if (!k || !v) { toast('键和值都要填', 'err'); return; }
      setOption(k, v); render();
      toast(`已写入 ${k} = ${v}`, 'ok');
    };
  },
  backup: () => { loadBackups(); },
  uosc: () => { loadUosc(); },
  shader: () => {
    const add = document.getElementById('shaderAdd');
    if (add) add.onclick = () => addShader(document.getElementById('shaderPick').value);
    const box = document.getElementById('memcList');
    if (box) box.onclick = e => {
      const el = e.target.closest('[data-memc]');
      if (el) setMemc(APP.catalog.memc[+el.dataset.memc].path);
    };
    prepareFusion();
  },
  tools: () => {
    const b = document.getElementById('scanBtn');
    if (b) b.onclick = doScan;
  }
};

             loading: false, queued: false };
const DB_GROUP_ICONS = {

  '视频': '🎬', '音频': '🔊', '字幕': '💬', '窗口': '🪟', '光盘设备': '💿', '均衡器': '🎚️',

function groupLabel(g) {
  return (I18N.lang() === 'en' && DB_GROUP_EN[g]) ? DB_GROUP_EN[g] : g;
}

function renderChips() {
  const box = document.getElementById('chips');
  if (!box) return;
  const groups = APP.dbGroups || [];
  box.innerHTML = `<span class="chip${DB.group ? '' : ' on'}" data-g="">${I18N.t('db.all')}</span>`
    + groups.map(g => `<span class="chip${DB.group === g ? ' on' : ''}" data-g="${esc(g)}">`
      + `${DB_GROUP_ICONS[g] || '⚙️'} ${esc(groupLabel(g))}</span>`).join('');
  box.onclick = e => {
    const c = e.target.closest('.chip');
    if (!c) return;
    DB.group = c.dataset.g || '';
    document.querySelectorAll('#chips .chip').forEach(x => x.classList.toggle('on', x === c));
    loadDb(true);
  };
}

async function loadDb(reset) {
  // 防抖期间用户又敲了字：记下"还得重置"，等这一轮结束再补一次，
  // 别直接 return 把重置丢掉（否则列表停在旧搜索结果上，q 已经变了）。
  if (DB.loading) { DB.queued = DB.queued || reset; return; }
  DB.loading = true;
  if (reset) { DB.offset = 0; DB.items = []; }
  const stat = document.getElementById('dbStat');
  if (stat) stat.textContent = '正在读取选项库…';

  // 静态模式（Q-006 裁决 A）：没有后端，直接取仓库里的选项库 JSON，
  // 在浏览器里做过滤/分组/分页。降级点：suggest / options（候选值合并）
  // 需要本机后端的精选层数据，静态视图里不展示。
  if (MPVCB.STATIC) {
    const db = await API.staticData('mpv_options_zh.json');
    DB.loading = false;
    if (!db || !db.options) {
      if (stat) stat.textContent = '';
      return;
    }
    const en = I18N.lang && I18N.lang() === 'en';
    let all = Object.values(db.options).map(x => ({
      group: x.group || '其它', key: x.key, label: x.key,
      desc: (en ? (x.en_desc || x.zh_desc) : x.zh_desc) || '',
      values: [], kind: 'db', type: x.type || 'str',
      default: x.default || '', range: x.range || '',
      deprecated: !!x.deprecated, suggest: [], options: [], open: false,
    }));
    if (DB.q) {
      const q = DB.q.toLowerCase();
      all = all.filter(x => (x.key + ' ' + x.desc + ' ' + x.label).toLowerCase().includes(q));
    }
    if (DB.group && DB.group !== 'all') all = all.filter(x => x.group === DB.group);
    APP.dbGroups = db.groups || [];
    DB.total = all.length;
    DB.items = all.slice(0, DB.limit);
    DB.offset = DB.items.length;
    if (reset) renderChips();
    renderStaticDb(all, stat);
    return;
  }

  const r = await API.dbOptions({
    q: DB.q, group: DB.group, offset: DB.offset, limit: DB.limit
  }).catch(() => ({ ok: false }));
  DB.loading = false;
  const host = document.getElementById('listHost');
  if (!host) return;
  if (!r.ok) {
    host.innerHTML = `<div class="card"><p class="note danger">❌ ${esc(r.detail || '选项库加载失败')}</p>
      <p class="note">跑一次 <code>py -3 tools\\build.py options-db</code> 就能生成。</p></div>`;
    if (stat) stat.textContent = '';
    return;
  }
  APP.dbGroups = r.groups || [];
  indexDbItems(r.items);
  DB.total = r.total;
  DB.items = DB.items.concat(r.items);
  DB.offset = DB.items.length;
  if (reset) renderChips();

  // 按分组分块渲染
  const groups = {};
  DB.items.forEach(x => (groups[x.group] = groups[x.group] || []).push(x));
  host.innerHTML = Object.keys(groups).map(g =>
    `<div class="card"><h2>${DB_GROUP_ICONS[g] || '⚙️'} ${esc(groupLabel(g))}
      <span class="muted" style="font-weight:400;font-size:12px"> · ${I18N.t('section.itemCount', { n: groups[g].length })}</span></h2>
      <div data-mount="${esc(g)}"></div></div>`).join('')
    || `<div class="card"><p class="note">${I18N.t('db.noMatch')}</p></div>`;
  Object.keys(groups).forEach(g => {
    const box = host.querySelector(`[data-mount="${CSS.escape(g)}"]`);
    if (box) mountOptions(box, groups[g]);
  });

/** 静态模式的全量浏览渲染（Q-006 A）：数据已在本地，一次性渲染全部命中项；
    分组卡片复用同一套 mountOptions，stat 行注明静态降级。 */
function renderStaticDb(all, stat) {
  const host = document.getElementById('listHost');
  if (!host) return;
  renderChips();
  const groups = {};
  all.forEach(x => (groups[x.group] = groups[x.group] || []).push(x));
  host.innerHTML = Object.keys(groups).map(g =>
    `<div class="card"><h2>${DB_GROUP_ICONS[g] || '⚙️'} ${esc(groupLabel(g))}
      <span class="muted" style="font-weight:400;font-size:12px"> · ${I18N.t('section.itemCount', { n: groups[g].length })}</span></h2>
      <div data-mount="${esc(g)}"></div></div>`).join('')
    || `<div class="card"><p class="note">${I18N.t('db.noMatch')}</p></div>`;
  Object.keys(groups).forEach(g => {
    const box = host.querySelector(`[data-mount="${CSS.escape(g)}"]`);
    if (box) mountOptions(box, groups[g]);
  });
  if (stat) {
    stat.innerHTML = I18N.t('db.staticStat', { n: all.length });
  }
  const more = document.getElementById('moreBox');
  if (more) more.style.display = 'none';
  decorateTags();
}

  const meta = r.meta || {};
  if (stat) {
    const scope = DB.q ? I18N.t('db.scopeSearch', { q: esc(DB.q) })
      : DB.group ? I18N.t('db.scopeGroup', { g: esc(groupLabel(DB.group)) })
      : I18N.t('db.scopeNone');
    stat.innerHTML = I18N.t('db.stat', { total: meta.count || r.total,
      zh: meta.with_zh || 0, scope: scope, hit: r.total, shown: DB.items.length });
  }
  const more = document.getElementById('moreBox');
  if (more) {
    more.style.display = DB.items.length < DB.total ? '' : 'none';
    const note = document.getElementById('moreNote');
    if (note) note.textContent = I18N.t('db.leftN', { n: Math.max(0, DB.total - DB.items.length) });
  }
  // 补上被丢掉的那次刷新（搜索防抖期间连打字的场景）
  const queued = DB.queued;
  DB.queued = false;
  if (queued) loadDb(true);
  decorateTags();
}

/* ---------------- 我的分组（拖拽 + 归属落盘） ----------------
   拖动每行左侧的 ⠿ 把手到分组上；归属存 /api/tags（设置文件，跨会话保留）。
   点分组名可只看该组；点名里的数字是组内参数个数。 */

const TAG_GROUPS = [
  { id: 'common', nameKey: 'tag.common' },
  { id: 'quality', nameKey: 'tag.quality' },
  { id: 'performance', nameKey: 'tag.performance' },
  { id: 'subtitle', nameKey: 'tag.subtitles' }
];
let TAGS = {};
let TAG_FILTER = '';

function tagName(id) {
  const g = TAG_GROUPS.find(x => x.id === id);
  return g ? I18N.t(g.nameKey) : '';
}

async function loadTags() {
  const r = await API.get('/api/tags');
  if (r.ok) { TAGS = r.tags || {}; renderTagBar(); decorateTags(); }
}

function renderTagBar() {
  const bar = document.getElementById('tagBar');
  if (!bar) return;
  const counts = {};
  Object.values(TAGS).forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  bar.innerHTML = `<div class="tagbar-line">
    <span class="note">${I18N.t('tag.note')}</span>
    <button class="tagdrop${TAG_FILTER ? '' : ' on'}" data-tag="" type="button">${I18N.t('db.all')}</button>
    ${TAG_GROUPS.map(g => `<button class="tagdrop${TAG_FILTER === g.id ? ' on' : ''}"
      data-tag="${g.id}" type="button">${I18N.t(g.nameKey)}${counts[g.id] ? ` <b>${counts[g.id]}</b>` : ''}</button>`).join('')}
  </div>`;
  bar.onclick = e => {
    const b = e.target.closest('[data-tag]');
    if (!b) return;
    TAG_FILTER = b.dataset.tag || '';
    renderTagBar();
    decorateTags();
  };
  bar.ondragover = e => { if (e.target.closest('[data-tag]')) e.preventDefault(); };
  bar.ondrop = async e => {
    const b = e.target.closest('[data-tag]');
    if (!b) return;
    e.preventDefault();
    const key = (e.dataTransfer.getData('text/plain') || '').trim();
    if (!key) return;
    const tag = b.dataset.tag;
    if (!tag || TAGS[key] === tag) delete TAGS[key];      // 拖回「全部」或拖到同一组 = 取消
    else TAGS[key] = tag;
    const r = await API.post('/api/tags/save', { tags: TAGS });
    toast((r.ok ? '✅ ' : '❌ ') + (r.detail || ''), r.ok ? 'ok' : 'err');
    if (r.ok) { TAGS = r.tags || TAGS; renderTagBar(); decorateTags(); }
  };
}

function decorateTags() {
  const host = document.getElementById('listHost');
  if (!host) return;
  host.querySelectorAll('.opt').forEach(row => {
    const key = row.dataset.key;
    const tag = TAGS[key];
    row.classList.toggle('tag-hidden', !!(TAG_FILTER && tag !== TAG_FILTER));
    let handle = row.querySelector('.tagdrag');
    if (!handle) {
      handle = document.createElement('span');
      handle.className = 'tagdrag';
      handle.draggable = true;
      handle.textContent = '⠿';
      handle.title = I18N.t('tag.dragTitle');
      const head = row.querySelector('.opt-head');
      if (head) head.insertBefore(handle, head.firstChild);
      handle.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', key);
        e.dataTransfer.effectAllowed = 'copy';
        row.classList.add('dragging');
      });
      handle.addEventListener('dragend', () => row.classList.remove('dragging'));
    }
    let badge = row.querySelector('.tagbadge');
    if (tag) {
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'tagbadge';
        const head = row.querySelector('.opt-head');
        if (head) head.insertBefore(badge, head.querySelector('.right') || null);
      }
      badge.textContent = tagName(tag);
      badge.dataset.tag = tag;
    } else if (badge) {
      badge.remove();
    }
  });
}

async function loadBackups() {

  if (!r.ok) { box.innerHTML = `<p class="note danger">${esc(r.detail)}</p>`; return; }
  if (!r.backups.length) { box.innerHTML = '<p class="note">' + I18N.t('ex.noBackups') + '</p>'; return; }
  box.innerHTML = r.backups.map((b, i) => `<div class="chain-item">
      <div style="min-width:0"><div>${esc(b.name)}</div>
        <code>${I18N.t('ex.originalFile', { name: esc(b.orig), size: b.size })}</code></div>
      <div class="right"><button class="btn small" data-bk="${i}" data-i18n="ex.rollback">↩️ 回滚</button></div>
    </div>`).join('');

let UOSC = null;

async function loadUosc() {
  const host = document.getElementById('uoscHost');
  if (!host) return;
  host.innerHTML = '<p class="note">' + I18N.t('ex.loading') + '</p>';
  const r = await API.get('/api/uosc' + (APP.target ? '?target=' + encodeURIComponent(APP.target) : ''));
  if (!r.ok) {
    const missing = r.exists === false;
    const en = I18N.lang() === 'en';
    const detail = missing && en ? I18N.t('ex.uoscMissingDetail') : r.detail;
    const hint = missing && en ? I18N.t('ex.uoscMissingHint', { path: r.path || '' }) : (r.hint || '');
    host.innerHTML = `<div class="card"><h2 data-i18n="section.uosc">🎛️ uosc 设置</h2>
      <p class="note ${missing ? '' : 'danger'}">${esc(detail)}</p>
      <p class="note">${esc(hint)}</p>
      ${missing ? `<p class="note">${I18N.t('ex.uoscMissing')}</p>
      <div class="actions"><button class="btn primary" id="uoscCreate" data-i18n="ex.uoscCreate">➕ 新建一份默认 uosc.conf</button></div>` : ''}
    </div>`;
    if (window.I18N) I18N.apply(host, true);
    host.onclick = async e => {
      if (!e.target.closest('#uoscCreate')) return;
      const res = await API.post('/api/uosc/save',
        { path: r.path, target: APP.target, values: {}, create: true });
      toast((res.ok ? '✅ ' : '❌ ') + res.detail, res.ok ? 'ok' : 'err');
      if (res.ok) loadUosc();
    };
    return;
  }
  UOSC = { data: r, gid: (r.groups.find(g => g.count) || { id: 'timeline' }).id, values: {} };
  renderUosc();
}

function uoscRow(row) {
  const key = esc(row.key);
  const def = row.default ? `默认 <code>${esc(row.default)}</code>` : '默认（空）';
  let ctrl;
  if (!row.known) {
    ctrl = `<code>${esc(row.value)}</code>
      <small class="muted">本工具不认识这个键，保存时原样留着</small>`;
  } else if (row.type === 'bool') {
    ctrl = `<label class="uosc-switch">` +
      `<input type="checkbox" data-uk="${key}" ${row.value === 'yes' ? 'checked' : ''}>` +
      `<span>${row.value === 'yes' ? '开' : '关'}</span></label>`;
  } else if (row.type === 'enum') {
    ctrl = `<select data-uk="${key}">` + (row.choices || []).map(c =>
      `<option ${c === row.value ? 'selected' : ''}>${esc(c)}</option>`).join('') + `</select>`;
  } else if (row.type === 'number') {
    ctrl = `<input type="number" step="any" data-uk="${key}" value="${esc(row.value)}">`;
  } else {
    ctrl = `<input type="text" data-uk="${key}" value="${esc(row.value)}" spellcheck="false">`;
  }
  return `<div class="uosc-row">
    <div><code class="uosc-key">${key}</code>
      <div class="uosc-zh">${esc(row.zh || '')}</div></div>
    <div>${ctrl}<small class="muted">${def}</small></div></div>`;
}

function renderUosc() {
  const host = document.getElementById('uoscHost');
  const r = UOSC.data;
  const gid = UOSC.gid;
  const rows = r.rows.filter(x => x.kind === 'kv' && x.group === gid);
  const group = r.groups.find(g => g.id === gid) || r.groups[0] || {};
  host.innerHTML = `
<style>
#uoscHost .uosc-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
#uoscHost .uosc-chip{padding:4px 10px;border-radius:999px;border:1px solid rgba(128,128,128,.35);
  background:transparent;cursor:pointer;font-size:12px}
#uoscHost .uosc-chip.on{border-color:var(--accent,#4aa3ff);color:var(--accent,#4aa3ff)}
#uoscHost .uosc-row{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;
  padding:9px 0;border-top:1px solid rgba(128,128,128,.18)}
#uoscHost .uosc-row:first-child{border-top:none}
#uoscHost .uosc-key{font-size:12px}
#uoscHost .uosc-zh{font-size:12px;opacity:.78;margin-top:3px;line-height:1.45}
#uoscHost .uosc-row input,#uoscHost .uosc-row select{width:100%;padding:5px 7px}
#uoscHost .uosc-switch{display:flex;align-items:center;gap:6px;font-size:13px}
#uoscHost .uosc-switch input{width:auto}
</style>
<div class="card">
  <h2>🎛️ uosc 设置 <span class="muted" style="font-weight:400;font-size:12px">
    · ${r.stats.known} 项已收录${r.stats.unknown ? `，${r.stats.unknown} 项不认识` : ''}</span></h2>
  <p class="note">这是 mpv 界面脚本 uosc 的设置文件，管的是<b>进度条 / 控制栏 / 顶栏 / 配色</b>，
    不影响播放行为。文件：<code>${esc(r.path)}</code> · ${esc(r.encoding)} · ${esc(r.newline)}</p>
  ${(r.warnings || []).map(w => `<p class="note danger">${esc(w)}</p>`).join('')}
  <div class="uosc-chips">${r.groups.map(g =>
    `<button class="uosc-chip${g.id === gid ? ' on' : ''}" data-ug="${esc(g.id)}">${esc(g.name)}
      ${g.count ? `<b>${g.count}</b>` : ''}</button>`).join('')}</div>
  <p class="note">${esc(group.desc || '')}</p>
  <div class="actions">
    <button class="btn" id="uoscReload">🔄 重新读取</button>
    <button class="btn" id="uoscPreview">👁️ 预览改动</button>
    <button class="btn primary" id="uoscSave">💾 保存</button>
    <span class="note" id="uoscDirty">没有改动</span>
  </div>
  <pre class="conf" id="uoscPrev" style="display:none;max-height:30vh;margin-top:10px"></pre>
  <div style="margin-top:10px">${rows.map(uoscRow).join('')
    || '<p class="note">这一类里没有键。uosc.conf 里缺的键需要你自己加，软件不替你补。</p>'}</div>

  host.onclick = async e => {
    const chip = e.target.closest('[data-ug]');
    if (chip) {
      UOSC.gid = chip.dataset.ug;
      renderUosc();
      return;
    }
    if (e.target.closest('#uoscReload')) { loadUosc(); return; }
    if (e.target.closest('#uoscPreview')) { previewUosc(); return; }
    if (e.target.closest('#uoscSave')) { saveUosc(); }

  const mark = () => {
    const n = Object.keys(UOSC.values).length;
    const d = document.getElementById('uoscDirty');
    if (d) d.textContent = n ? `未保存改动 ${n} 项` : '没有改动';

    UOSC.values[k] = el.type === 'checkbox' ? (el.checked ? 'yes' : 'no') : el.value;
    mark();
  };
  host.oninput = onEdit;
  host.onchange = onEdit;

async function previewUosc() {
  const box = document.getElementById('uoscPrev');
  const keys = Object.keys(UOSC.values);
  if (!keys.length) { toast('还没有改动', 'err'); return; }
  const r = await API.post('/api/uosc/save', {
    path: UOSC.data.path, target: APP.target, values: UOSC.values, dry_run: true
  });
  if (!r.ok) { toast('❌ ' + r.detail, 'err'); return; }
  box.style.display = '';

}

async function saveUosc() {
  const keys = Object.keys(UOSC.values);
  if (!keys.length) { toast('还没有改动', 'err'); return; }
  const r = await API.post('/api/uosc/save', {
    path: UOSC.data.path, target: APP.target, values: UOSC.values
  });
  toast((r.ok ? '✅ ' : '❌ ') + r.detail, r.ok ? 'ok' : 'err');

}

async function boot() {
  loadLocal();
  const [s] = await Promise.all([API.status(), loadOptions()]);
  document.getElementById('ver').textContent = 'v' + s.version;
  APP.dbCount = (APP.options.db && APP.options.db.count) || 0;
  APP.dbGroups = (APP.options.db && APP.options.db.groups) || [];
  if (!APP.target && s.lazy_pc) APP.target = s.lazy_pc;
  const tl = document.getElementById('targetLabel');
  tl.textContent = APP.target ? shortPath(APP.target) : '未设置';
  tl.title = APP.target || '';
  buildSections();
  renderSidebar();
  await loadCatalog();
  loadTags();
  if (!APP.source) {
    const cfg = (APP.catalog.configs || []).find(c => /mpv\.conf$/i.test(c.name));
    if (cfg) APP.source = cfg.path;
  }
  // 从地狱模式带过来的草稿：整段放进「自定义选项」，不解析、不猜
  if (new URLSearchParams(location.search).get('from') === 'hell') {
    let draft = null;
    try { draft = localStorage.getItem('mpvcb-hell-draft'); } catch (e) { draft = null; }
    if (draft) {
      APP.custom = draft;
      cur = 'custom';
      toast('已把地狱模式的草稿放进「自定义选项」，检查完再决定怎么用', 'ok');
    }
  }
  render();
  setWriteMode(APP.writeMode);
  initModeBar();                       // R-26：接上「创建 / 修改」开关
  const dt = document.getElementById('diffToggle');
  if (dt) dt.onclick = toggleDiff;     // R-14：逐行对比
  document.getElementById('writeSeg').onclick = e => {
    const b = e.target.closest('button');
    if (b) setWriteMode(b.dataset.v);
  };
  const lt = document.getElementById('loadTop');
  if (lt) lt.onclick = async () => {
    const r = await loadExistingConfig(APP.source || '');
    if (r.ok) render();
  };
  // 2026-11-08 动效轮发现并修复：applyTop 从未绑定点击——顶栏「生成配置」点了没反应，
  // 而快捷键映射表（api.js HOTKEY_PRIMARY）正指向它。与其共用的预览卡按钮同一动作。
  const at = document.getElementById('applyTop');
  if (at) at.onclick = () => applyConfig(at);
  const sl = document.getElementById('srcLoad');
  if (sl) sl.onclick = async () => {
    const r = await loadExistingConfig(document.getElementById('srcSelect').value);
    if (r.ok) render();
  };
  const pl = document.getElementById('profileLoad');
  if (pl) pl.onclick = () => loadProfile(document.getElementById('profileSel').value);
  doPreview();
}

// T14 + i18n：切语言后重取选项元数据并重绘（advanced 页同款）。
// 此前 expert 没有这个监听——state.js 渲染的行与后端元数据在切换后停在旧语言，
// 只有词典兜底扫得到的静态节点会变。APP.values 是用户自己的选择，不经过这条路径。
document.addEventListener('i18n:change', async () => {
  APP.options = { core: [], native: [], groups: [] };
  await loadOptions();
  buildSections();
  render();
  renderModeBar();
  doPreview();
  updateSubPreview();
});
boot();
</script>
</body>
</html>
