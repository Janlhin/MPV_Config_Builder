name: Pages（静态站点）

# 第 12 项（Q-006 裁决 A）：仓库根直接上 GitHub Pages。
# 页面在 /webui/static/，数据 JSON 在 /data/（仓库里只有一份，不复制），
# 根级 index.html 负责跳到 webui/static/index.html。
# 静态模式下页面自动降级：选项库只读浏览 + 文档原文，写配置需本机后端（见 README）。

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 私有仓库在未开通 Pages 计费时启用不了站点——工作流红着只会掩盖真问题，
    # 故整任务非阻断；仓库设置里启用 Pages（或转公开）后自然变绿。
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 根目录不再放散文类文件（2026-11-17 规则整改）：跳转页收在 docs/index.html，
      # 部署前复制回根目录，GitHub Pages 才能把站点根 / 跳到 webui/static/index.html。
      # 产物只是工作区里的未跟踪文件，不入库（见 .gitignore 的 /index.html）。
      - name: 生成根跳转页
        run: Copy-Item -LiteralPath docs/index.html -Destination index.html -Force
        shell: pwsh
      - uses: actions/configure-pages@v5
        with:/n          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v5
